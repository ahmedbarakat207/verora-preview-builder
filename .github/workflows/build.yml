# Builder repo: .github/workflows/build.yml
name: build-preview

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build id (owner-repo-sha8)
        required: true

env:
  ID: ${{ inputs.build_id }}
  AWS_DEFAULT_REGION: auto

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate id
        run: echo "$ID" | grep -Eq '^[a-z0-9_.-]+$'

      - name: Fetch source from storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
        run: |
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/src/$ID.zip" src.zip --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          mkdir src && unzip -q src.zip -d src
          mv src/*/ app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fabricate a missing `.env` (or similar) so the bundle compiles:
      # collect the key names the Dart code actually reads and write them
      # with safe placeholder values. Runs BEFORE sanitize so the fresh
      # stub is never stripped as "missing".
      - name: Fabricate missing env file
        working-directory: app
        run: |
          python3 - <<'EOF'
          import glob, os, re, subprocess
          # env filenames the pubspec declares as bundled assets
          wanted = set()
          try:
              pub = open("pubspec.yaml").read()
              in_assets = False
              for line in pub.split("\n"):
                  s = line.strip()
                  if re.match(r"^assets\s*:", s):
                      in_assets = True; continue
                  if in_assets:
                      if re.match(r"^[a-zA-Z0-9_\"' ]", line) and not line.startswith((" ", "\t")):
                          in_assets = False; continue
                      m = re.match(r"\s*-\s*[\"']?([^\"'#\s]+)", s)
                      if m and os.path.basename(m.group(1)).startswith(".env"):
                          wanted.add(m.group(1))
          except FileNotFoundError:
              pass
          if not wanted:
              print("preview-builder: no .env assets declared")
              raise SystemExit
          # key names the code reads: dotenv.env['K'], dotenv.get('K'), dotenv.maybeGet('K')
          keys = set()
          try:
              out = subprocess.run(
                  ["grep", "-rhoE", "dotenv\\.(env\\[|get\\(|maybeGet\\()['\"][A-Za-z_][A-Za-z0-9_]*", "lib"],
                  capture_output=True, text=True).stdout
              for hit in out.split("\n"):
                  k = re.search(r"['\"]([A-Za-z_][A-Za-z0-9_]*)$", hit.strip())
                  if k and len(keys) < 50:
                      keys.add(k.group(1))
          except Exception as e:
              print(f"preview-builder: key scan failed ({e})")
          for rel in sorted(wanted):
              if os.path.exists(rel):
                  print(f"preview-builder: {rel} already committed, keeping it")
                  continue
              os.makedirs(os.path.dirname(rel) or ".", exist_ok=True)
              with open(rel, "w") as f:
                  f.write("# Fabricated by VERORA preview builder — placeholder values only.\n")
                  for k in sorted(keys) or ["PLACEHOLDER"]:
                      f.write(f"{k}=preview\n")
          print(f"preview-builder: fabricated {sorted(wanted)} with {len(keys)} keys")
          EOF

      # Drop asset entries whose files aren't committed: Flutter fails the
      # whole bundle on one missing asset, and preview builds must never
      # die on repo hygiene. Dropped entries are echoed so the log tail
      # explains any runtime gap.
      - name: Sanitize missing assets
        working-directory: app
        run: |
          python3 - <<'EOF'
          import glob, os
          p = "pubspec.yaml"
          if not os.path.exists(p):
              print("no pubspec.yaml, skipping sanitize")
              raise SystemExit
          lines = open(p).read().split("\n")
          out, i = [], 0
          in_flutter, in_assets = False, False
          while i < len(lines):
              line, stripped = lines[i], lines[i].lstrip()
              indent = len(line) - len(stripped)
              if indent == 0 and stripped.startswith("flutter:"):
                  in_flutter, in_assets = True, False
                  out.append(line); i += 1; continue
              if indent == 0 and stripped and not stripped.startswith("#"):
                  in_flutter, in_assets = False, False
                  out.append(line); i += 1; continue
              if in_flutter and stripped.startswith("assets:"):
                  in_assets = True
                  out.append(line); i += 1; continue
              if in_assets and stripped.startswith("- "):
                  pat = stripped[2:].strip().strip("\"'").split("?")[0]
                  if pat.startswith(("http://", "https://", "data:")):
                      out.append(line); i += 1; continue
                  hits = glob.glob(pat, recursive=True) if any(c in pat for c in "*?[") else (
                      [pat] if os.path.exists(pat) else [])
                  if hits:
                      out.append(line)
                  else:
                      print(f"preview-builder: dropping missing asset '{pat}'")
                  i += 1; continue
              out.append(line); i += 1
          open(p, "w").write("\n".join(out))
          print("preview-builder: pubspec assets sanitized")
          EOF

      # No storage secrets in this step: it runs the app's own dependencies.
      - name: Build Flutter web
        working-directory: app
        run: |
          set -o pipefail
          {
            [ -d web ] || flutter create . --platforms web
            flutter pub get || flutter pub upgrade
            flutter build web --release --base-href "/$ID/"
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
        run: |
          EP="${{ secrets.R2_ENDPOINT }}"; B="s3://${{ secrets.R2_BUCKET }}"
          aws s3 sync app/build/web "$B/$ID/" --endpoint-url "$EP"

      - name: Report to site
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then OK="true"; else OK="false"; fi
          LOG="$(tail -c 3000 build.log 2>/dev/null || echo 'Build failed before compiling.')"
          # JSON-escape the log tail with jq (preinstalled on runners)
          PAYLOAD=$(jq -n --arg id "$ID" --argjson ok "$OK" --arg log "$LOG" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{build_id:$id,ok:$ok,log:$log,log_url:$url}')
          curl -s -X POST "$SITE_URL/api/proof-builds/callback" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}

      - name: Delete staged source
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
        run: aws s3 rm "s3://${{ secrets.R2_BUCKET }}/src/$ID.zip" --endpoint-url "${{ secrets.R2_ENDPOINT }}"
